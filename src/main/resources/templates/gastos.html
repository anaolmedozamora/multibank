<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gastos</title>
</head>

<body>
    <p><a th:href="@{/}">Inicio</a> | <a th:href="@{/cuentas}">Cuentas bancarias</a></p>
    <h1>Gastos</h1>

    <p>
        <a th:href="@{/gastos(semana=${anterior})}">&laquo; Semana anterior</a>
        &nbsp;
        <strong>
            Semana del <span th:text="${#temporals.format(lunes,'dd/MM/yyyy')}"></span>
            al <span th:text="${#temporals.format(domingo,'dd/MM/yyyy')}"></span>
        </strong>
        &nbsp;
        <a th:href="@{/gastos(semana=${siguiente})}">Semana siguiente &raquo;</a>
    </p>

    <p>
        Total: <strong th:text="${#numbers.formatDecimal(total,1,'POINT',2,'COMMA')} + ' €'"></strong> |
        Pendiente: <strong th:text="${#numbers.formatDecimal(totalPendiente,1,'POINT',2,'COMMA')} + ' €'"></strong> |
        Pagado: <strong th:text="${#numbers.formatDecimal(totalPagado,1,'POINT',2,'COMMA')} + ' €'"></strong>
    </p>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Concepto</th>
                <th>Cuenta</th>
                <th>Importe</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="g : ${gastos}">
                <td th:text="${#temporals.format(g.fechaGasto,'dd/MM/yyyy')}"></td>
                <td th:text="${g.concepto}"></td>
                <td th:text="${g.cuentaId != null} ? ${nombresCuenta[g.cuentaId]} : '—'"></td>
                <td th:text="${#numbers.formatDecimal(g.importe,1,'POINT',2,'COMMA')} + ' €'"></td>
                <td th:text="${g.estado}"></td>
                <td>
                    <form th:action="@{/gastos/{id}/estado(id=${g.id})}" method="post" style="display:inline">
                        <input type="hidden" name="semana" th:value="${lunes}">
                        <button type="submit"
                            th:text="${g.estado == 'PENDIENTE'} ? 'Marcar pagado' : 'Marcar pendiente'"></button>
                    </form>
                    <form th:action="@{/gastos/{id}/eliminar(id=${g.id})}" method="post" style="display:inline"
                        onsubmit="return confirm('¿Eliminar este gasto?');">
                        <input type="hidden" name="semana" th:value="${lunes}">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(gastos)}">
                <td colspan="6">No hay gastos esta semana.</td>
            </tr>
        </tbody>
    </table>

    <h2>Nuevo gasto</h2>
    <form th:action="@{/gastos}" th:object="${gastoForm}" method="post">
        <input type="hidden" name="semana" th:value="${lunes}">
        <p>
            <label>Fecha* <input type="date" th:field="*{fechaGasto}"></label>
            <span th:if="${#fields.hasErrors('fechaGasto')}" th:errors="*{fechaGasto}" style="color:red"></span>
        </p>
        <p>
            <label>Concepto* <input type="text" th:field="*{concepto}" size="40"></label>
            <span th:if="${#fields.hasErrors('concepto')}" th:errors="*{concepto}" style="color:red"></span>
        </p>
        <p>
            <label>Importe (€)* <input type="number" step="0.01" min="0.01" th:field="*{importe}"></label>
            <span th:if="${#fields.hasErrors('importe')}" th:errors="*{importe}" style="color:red"></span>
        </p>
        <p>
            <label>Cuenta
                <select th:field="*{cuentaId}">
                    <option value="">— sin asignar —</option>
                    <option th:each="c : ${cuentasActivas}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('cuentaId')}" th:errors="*{cuentaId}" style="color:red"></span>
        </p>
        <p>
            <label>Vencimiento <input type="date" th:field="*{fechaVencimiento}"></label>
        </p>
        <p>
            <label><input type="checkbox" th:field="*{pagado}"> Ya pagado</label>
        </p>
        <button type="submit">Guardar gasto</button>
    </form>
</body>

</html>
